<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Abhinav &amp; Nimya · Logo Options</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f6e7c9; color: #183b25; font-family: Georgia, serif; text-align: center; }
    h1 { font-size: 28px; font-weight: normal; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; max-width: 1200px; margin: 32px auto; }
    figure { margin: 0; padding: 16px; background: #fff9ed; border: 1px solid #d8bc86; border-radius: 8px; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin: 16px 0; font-size: 20px; }
    a { color: #805018; font-size: 15px; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Abhinav &amp; Nimya</h1>
  <p>Custom wedding monograms · gold, jasmine &amp; a shared flame</p>
  <main>
    <figure><img src="assets/icons/logo-an-interwoven.svg" alt="Interwoven green A and gold N with a sweeping flourish"/><figcaption>1 · Interwoven</figcaption><a href="assets/icons/logo-an-interwoven.svg" download>Download SVG</a></figure>
    <figure><img src="assets/icons/logo-an-jasmine.svg" alt="Five-petal jasmine flower with an A and N monogram"/><figcaption>2 · Jasmine Bloom</figcaption><a href="assets/icons/logo-an-jasmine.svg" download>Download SVG</a></figure>
    <figure><img src="assets/icons/logo-an-lamp.svg" alt="A and N initials forming a brass lamp beneath a shared flame"/><figcaption>3 · Shared Flame</figcaption><a href="assets/icons/logo-an-lamp.svg" download>Download SVG</a></figure>
  </main>
</body>
</html>
